name: Scrape CBS injury report

on:
  schedule:
    # ~12:15 AM and ~12:15 PM Eastern during daylight time (an hour earlier in winter).
    # GitHub often starts scheduled jobs several minutes late; the tracker doesn't mind.
    - cron: "15 4 * * *"
    - cron: "15 16 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Skip the row-count sanity check"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - name: Tests
        run: python -m pytest -q

      - name: Scrape and update data
        run: python scripts/update.py ${{ inputs.force && '--force' || '' }}

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: injury report $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
