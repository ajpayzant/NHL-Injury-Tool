name: Scrape CBS injury report and Daily Faceoff news

on:
  schedule:
    # Every run scrapes CBS and Daily Faceoff (~1 min). GitHub throttles scheduled jobs
    # heavily (this hourly cron lands every 4-10 hours), so it's only a fallback: a
    # cron-job.org job triggers workflow_dispatch every 15 minutes for the real cadence.
    # Streamlit Cloud pulls each data commit within minutes and open app tabs rerun when
    # it lands. The tracker's 12-hour close window means frequency doesn't change when an
    # injury is marked returned.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Skip the row-count sanity check"
        type: boolean
        default: false
      news_only:
        description: "Only fetch Daily Faceoff injury news"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - name: Tests
        run: python -m pytest -q

      - name: Scrape and update data
        if: ${{ !inputs.news_only }}
        run: python scripts/update.py ${{ inputs.force && '--force' || '' }}

      - name: Update injury news
        if: ${{ inputs.news_only }}
        run: python scripts/update.py --news-only

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: ${{ inputs.news_only && 'injury news' || 'injury report' }} $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
